name: Auto-Approve App Request

on:
  issues:
    types: [labeled]

# Queue approvals - only one can run at a time
concurrency:
  group: auto-approve-app-request
  cancel-in-progress: false

jobs:
  auto-approve:
    # Only run if the issue is labeled with 'auto-approved'
    if: github.event.label.name == 'auto-approved'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - name: Post progress comment
        id: progress
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Auto-Approval in Progress\n\nThis app request was automatically validated and is being processed.\n\n- [ ] Parsing app information\n- [ ] Adding to supported apps list\n- [ ] Committing changes\n- [ ] Triggering build workflow`
            });
            core.setOutput('comment_id', comment.id);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Add app to list
        id: add-app
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ""
        run: python .github/scripts/add_new_app.py

      - name: Record pending request
        if: steps.add-app.outputs.app_added == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPS_JSON: ${{ steps.add-app.outputs.apps_json }}
        run: python .github/scripts/pending_requests.py record

      - name: Commit changes
        if: steps.add-app.outputs.app_added == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/scripts/collect_app_info.py .github/pending-requests.json
          git commit -m "Add ${{ steps.add-app.outputs.commit_message }}"
          git push

      # Build is auto-triggered by push to main (collect_app_info.py change)

      - name: Comment success
        if: steps.add-app.outputs.app_added == 'true'
        uses: actions/github-script@v7
        env:
          APPS_JSON: ${{ steps.add-app.outputs.apps_json }}
          FALLBACK_NAME: ${{ steps.add-app.outputs.app_name }}
          FALLBACK_CASK: ${{ steps.add-app.outputs.cask_name }}
          FALLBACK_TYPE: ${{ steps.add-app.outputs.app_type }}
        with:
          script: |
            const commentId = ${{ steps.progress.outputs.comment_id }};

            let apps = [];
            try {
              apps = JSON.parse(process.env.APPS_JSON);
            } catch (e) {
              // Fallback for single app
              apps = [{
                name: process.env.FALLBACK_NAME,
                cask: process.env.FALLBACK_CASK,
                type: process.env.FALLBACK_TYPE
              }];
            }

            let body = `## Auto-Approved\n\n`;
            body += `This app request was automatically validated and approved.\n\n`;
            body += `- [x] Parsing app information\n`;
            body += `- [x] Adding to supported apps list\n`;
            body += `- [x] Committing changes\n`;
            body += `- [x] Triggering build workflow\n\n`;

            body += `### What was matched\n\n`;
            body += `| App Name | Cask | Type | Match |\n|----------|------|------|-------|\n`;
            for (const app of apps) {
              // No score means the cask was named explicitly, not searched for.
              const match = app.score == null ? 'exact request' : `${Math.round(app.score * 100)}%`;
              body += `| ${app.name} | \`${app.cask}\` | \`${app.type}\` | ${match} |\n`;
            }

            const withUrl = apps.filter(a => a.url);
            if (withUrl.length > 0) {
              body += `\n<details>\n<summary>Source download URLs</summary>\n\n`;
              for (const app of withUrl) {
                body += `- **${app.name}**: ${app.url}\n`;
              }
              body += `\n</details>\n`;
            }

            if (apps.some(a => a.type === 'pkg')) {
              body += `\n<details>\n<summary>Maintainer note for PKG apps</summary>\n\n`;
              body += `If the build fails for a PKG app it may be PKG-in-PKG. Move it from `;
              body += `\`pkg_urls\` to \`pkg_in_pkg_urls\` in \`collect_app_info.py\`. This cannot be `;
              body += `detected from the package alone, since ordinary distribution packages `;
              body += `contain component packages too.\n\n</details>\n`;
            }

            body += `\n### What happens next\n\n`;
            body += `The build has been triggered. The app is normally downloadable from the `;
            body += `catalog about 20 minutes from now, and fully enriched (icon, category, `;
            body += `bundle ID, uninstall script) within 30 minutes.\n\n`;
            body += `This issue will be updated automatically once the app is live. `;
            body += `[Track the build](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/build-app-packages.yml)`;

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Close issue
        if: |
          steps.add-app.outputs.app_added == 'true' &&
          steps.add-app.outputs.needs_review != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: [...context.payload.issue.labels.map(l => l.name), 'approved']
            });

      - name: Comment needs review
        if: steps.add-app.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_JSON: ${{ steps.add-app.outputs.review_json }}
        with:
          script: |
            const review = JSON.parse(process.env.REVIEW_JSON || '[]');
            const addedSome = '${{ steps.add-app.outputs.app_added }}' === 'true';
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};

            let body = `## Needs Review\n\n`;
            body += addedSome
              ? `Some apps were added, but these could not be matched confidently:\n\n`
              : `No Homebrew cask matched this request confidently enough to add automatically.\n\n`;

            for (const item of review) {
              body += `**${item.name}**\n\n`;
              if (item.candidates.length === 0) {
                body += `No Homebrew cask found.\n\n`;
                continue;
              }
              body += item.reason === 'ambiguous'
                ? `Several casks match equally well, so the choice is not automatic:\n\n`
                : `Closest candidates, none confident enough to add automatically:\n\n`;
              body += `| Cask | Name | Match |\n|------|------|-------|\n`;
              for (const c of item.candidates) {
                body += `| \`${c.cask}\` | ${c.name} | ${Math.round(c.score * 100)}% |\n`;
              }
              body += `\n`;
            }

            body += `A maintainer can approve the correct one with:\n\n`;
            body += `\`\`\`\n/approve <cask-name>\n\`\`\`\n\n`;
            body += `If the app is not on Homebrew, it cannot be added automatically.`;

            if (commentId && !addedSome) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'auto-approved'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review']
            });

      - name: Comment duplicate
        if: steps.add-app.outputs.all_duplicates == 'true'
        uses: actions/github-script@v7
        env:
          DUPLICATE_APPS: ${{ steps.add-app.outputs.duplicate_apps }}
        with:
          script: |
            const duplicates = (process.env.DUPLICATE_APPS || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};

            let body = `## Already in IntuneBrew\n\n`;
            body += `No changes were needed. `;
            body += duplicates.length > 1
              ? `The requested apps are already in the catalog:\n\n`
              : `The requested app is already in the catalog:\n\n`;
            for (const cask of duplicates) {
              body += `- \`${cask}\`\n`;
            }
            body += `\n[Browse the full list of supported apps](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/supported_apps.json)\n\n`;
            body += `Closing this issue as a duplicate.`;

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'auto-approved'
            }).catch(() => {});

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: [...issue.labels.map(l => l.name), 'duplicate']
            });

      - name: Comment failure
        if: |
          steps.add-app.outputs.all_duplicates != 'true' &&
          (failure() ||
           (steps.add-app.outputs.app_added == 'false' &&
            steps.add-app.outputs.needs_review != 'true'))
        uses: actions/github-script@v7
        with:
          script: |
            const error = `${{ steps.add-app.outputs.error_message }}` || 'Unknown error';
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};

            const body = `## Auto-Approval Failed\n\n- [x] Parsing app information\n- [ ] Adding to supported apps list\n- [ ] Committing changes\n- [ ] Triggering build workflow\n\n**Error:** ${error}\n\nThis issue has been flagged for manual review.`;

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            // Remove auto-approved label and add needs-review
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'auto-approved'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review']
            });
