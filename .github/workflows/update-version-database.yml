name: Update Version Database and Send Notifications
on:
  workflow_run:
    workflows: ["Build App Packages and Collect App Information"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'
permissions:
  contents: read
concurrency:
  group: version-database
  cancel-in-progress: false
jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install database client
        run: npm install --no-save --ignore-scripts @supabase/supabase-js@2.90.1
      - name: Synchronize versions and retry pending notifications
        run: node .github/scripts/update_versions.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTIFICATIONS_API_URL: ${{ secrets.NOTIFICATIONS_API_URL }}
          NOTIFICATIONS_API_KEY: ${{ secrets.NOTIFICATIONS_API_KEY }}
