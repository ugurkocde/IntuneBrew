name: Approve App Request

on:
  issue_comment:
    types: [created]

jobs:
  approve-app:
    # Only run if comment contains "/approve"
    if: |
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/approve')
    # Only eligible approval jobs enter the shared writer queue.
    concurrency:
      group: app-request-approvals
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      actions: write

    steps:
      - name: Check user permission
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.payload.comment.user.login;
            const repoOwner = context.repo.owner;

            // Only the repository owner can use /approve
            if (commenter.toLowerCase() !== repoOwner.toLowerCase()) {
              core.setFailed(`Only the repository owner can approve app requests. User: ${commenter}`);
              return;
            }

      - name: Add reaction
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Post progress comment
        id: progress
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Processing App Request\n\n- [ ] Validating apps on Homebrew\n- [ ] Adding to supported apps list\n- [ ] Committing changes\n- [ ] Triggering build workflow`
            });
            core.setOutput('comment_id', comment.id);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Add app to list
        id: add-app
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python .github/scripts/add_new_app.py

      - name: Record pending request
        if: steps.add-app.outputs.app_added == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPS_JSON: ${{ steps.add-app.outputs.apps_json }}
          NEEDS_REVIEW: ${{ steps.add-app.outputs.needs_review }}
        run: python .github/scripts/pending_requests.py record

      - name: Commit changes
        if: steps.add-app.outputs.app_added == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          python .github/scripts/commit_catalog.py --approval

      # Build is auto-triggered by push to main (collect_app_info.py change)

      - name: Comment success
        if: steps.add-app.outputs.app_added == 'true'
        uses: actions/github-script@v7
        env:
          APPS_JSON: ${{ steps.add-app.outputs.apps_json }}
          APP_NAME: ${{ steps.add-app.outputs.app_name }}
          CASK_NAME: ${{ steps.add-app.outputs.cask_name }}
          APP_TYPE: ${{ steps.add-app.outputs.app_type }}
        with:
          script: |
            const appsJson = process.env.APPS_JSON;
            const commentId = ${{ steps.progress.outputs.comment_id }};

            let apps = [];
            try {
              apps = JSON.parse(appsJson);
            } catch (e) {
              // Fallback for single app
              apps = [{
                name: process.env.APP_NAME,
                cask: process.env.CASK_NAME,
                type: process.env.APP_TYPE
              }];
            }

            let body = `## Approved\n\n`;
            body += `- [x] Validating apps on Homebrew\n`;
            body += `- [x] Adding to supported apps list\n`;
            body += `- [x] Committing changes\n`;
            body += `- [x] Triggering build workflow\n\n`;

            if (apps.length === 1) {
              body += `**${apps[0].name}** has been queued for the catalog build.\n\n`;
            } else {
              body += `**${apps.length} apps** have been queued for the catalog build:\n\n`;
            }

            body += `| App Name | Cask | Type |\n|----------|------|------|\n`;
            let hasPkg = false;
            for (const app of apps) {
              body += `| ${app.name} | \`${app.cask}\` | \`${app.type}\` |\n`;
              if (app.type === 'pkg') hasPkg = true;
            }

            if (hasPkg) {
              body += `\n> **Note:** If the build fails for PKG apps, they may be PKG-in-PKG. Move them from \`pkg_urls\` to \`pkg_in_pkg_urls\` in \`collect_app_info.py\`.\n`;
            }

            body += `\nThe build has been triggered. This issue remains open and will receive a completion notice when the app is available. Track progress: [Actions](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/build-app-packages.yml)`;

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Mark request approved
        if: steps.add-app.outputs.app_added == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['approved']
            });
            // Only the build notifier closes fulfilled requests.
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'open'
            });

      - name: Comment needs review
        if: steps.add-app.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        env:
          REVIEW_JSON: ${{ steps.add-app.outputs.review_json }}
        with:
          script: |
            const review = JSON.parse(process.env.REVIEW_JSON || '[]');
            const addedSome = '${{ steps.add-app.outputs.app_added }}' === 'true';
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};

            let body = `## Needs Review\n\n`;
            body += addedSome
              ? `Some apps were queued, but these still need review:\n\n`
              : `No Homebrew cask matched this request confidently enough to add automatically.\n\n`;

            for (const item of review) {
              body += `**${item.name}**\n\n`;
              if (item.candidates.length === 0) {
                body += `${item.reason}.\n\n`;
                continue;
              }
              body += item.reason === 'ambiguous'
                ? `Several casks match equally well, so the choice is not automatic:\n\n`
                : `Closest candidates, none confident enough to add automatically:\n\n`;
              body += `| Cask | Name | Match |\n|------|------|-------|\n`;
              for (const c of item.candidates) {
                body += `| \`${c.cask}\` | ${c.name} | ${Math.round(c.score * 100)}% |\n`;
              }
              body += `\n`;
            }

            body += `A maintainer can approve the correct one with:\n\n`;
            body += `\`\`\`\n/approve <cask-name>\n\`\`\`\n\n`;
            body += `If the app is not on Homebrew, it cannot be added automatically.`;

            if (commentId && !addedSome) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'auto-approved'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review']
            });

      - name: Comment duplicate
        if: steps.add-app.outputs.all_duplicates == 'true'
        uses: actions/github-script@v7
        env:
          DUPLICATE_APPS: ${{ steps.add-app.outputs.duplicate_apps }}
        with:
          script: |
            const duplicates = (process.env.DUPLICATE_APPS || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};

            let body = `## Already in IntuneBrew\n\n`;
            body += `No changes were needed. `;
            body += duplicates.length > 1
              ? `The requested apps are already in the catalog:\n\n`
              : `The requested app is already in the catalog:\n\n`;
            for (const cask of duplicates) {
              body += `- \`${cask}\`\n`;
            }
            body += `\n[Browse the full list of supported apps](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/supported_apps.json)\n\n`;
            body += `Closing this issue as a duplicate.`;

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'auto-approved'
            }).catch(() => {});

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: [...issue.labels.map(l => l.name), 'duplicate']
            });

      - name: Comment failure
        if: |
          steps.progress.outputs.comment_id != '' &&
          steps.add-app.outputs.all_duplicates != 'true' &&
          (failure() || (steps.add-app.outputs.app_added == 'false' && steps.add-app.outputs.needs_review != 'true'))
        uses: actions/github-script@v7
        env:
          ERROR_MESSAGE: ${{ steps.add-app.outputs.error_message }}
        with:
          script: |
            const error = process.env.ERROR_MESSAGE || 'Unknown error';
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};

            const body = `## Failed to Add App\n\n- [x] Validating app on Homebrew\n- [ ] Adding to supported apps list\n- [ ] Committing changes\n- [ ] Triggering build workflow\n\n**Error:** ${error}\n\nPlease check the issue and try again.`;

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review']
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'open'
            });

      - name: Update reaction
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const succeeded = '${{ steps.add-app.outputs.app_added }}' === 'true';

            // Remove eyes reaction
            try {
              const reactions = await github.rest.reactions.listForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id
              });

              for (const r of reactions.data) {
                if (r.content === 'eyes' && r.user.login === 'github-actions[bot]') {
                  await github.rest.reactions.deleteForIssueComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: context.payload.comment.id,
                    reaction_id: r.id
                  });
                }
              }
            } catch (e) {}

            // Add final reaction
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: succeeded ? 'rocket' : 'confused'
            });
