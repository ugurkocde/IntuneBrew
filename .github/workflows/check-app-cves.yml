          # CONFIGURATION
          # =============================================================================

          NVD_API_KEY = os.environ.get('NVD_API_KEY')
          SPECIFIC_APP = os.environ.get('SPECIFIC_APP', '').strip()
          FULL_SYNC = os.environ.get('FULL_SYNC', 'false').lower() == 'true'

