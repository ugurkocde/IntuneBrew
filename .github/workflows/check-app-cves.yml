name: Check App CVEs

on:
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Run full sync (ignore last sync date)'
        required: false
        default: 'false'
        type: boolean
      specific_app:
        description: 'Sync specific app only (leave empty for all)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: "0 6 * * *" # Run daily at 6 AM UTC

concurrency:
  group: check-app-cves
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-cves:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check CVEs for apps
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SPECIFIC_APP: ${{ github.event.inputs.specific_app }}
          FULL_SYNC: ${{ github.event.inputs.full_sync }}
        run: |
          cat > check_cves.py << 'PYTHON_SCRIPT'
