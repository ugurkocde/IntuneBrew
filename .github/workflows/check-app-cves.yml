              # Enterprise
              "citrix_workspace": ("citrix", "workspace_app", ["receiver"]),
              "cisco_jabber": ("cisco", "jabber", []),
              "okta_advanced_server_access": ("okta", "advanced_server_access", []),
              "company_portal": ("microsoft", "company_portal", []),
              "microsoft_auto_update": ("microsoft", "autoupdate", []),

              # Other Popular Apps
              "steam": ("valvesoftware", "steam_client", ["steam"]),
              "canva": ("canva", "canva", []),
              "figma": ("figma", "figma", []),
              "sketch": ("sketch", "sketch", []),
              "asana": ("asana", "asana", []),
              "basecamp": ("basecamp", "basecamp", []),
              "airtable": ("airtable", "airtable", []),
              "miro": ("miro", "miro", []),
              "loom": ("loom", "loom", []),
              "grammarly": ("grammarly", "grammarly", []),
              "deepl": ("deepl", "deepl", []),
              "ollama": ("ollama", "ollama", []),
              "chatgpt": ("openai", "chatgpt", []),
          }

          # =============================================================================
          # CISA KEV CATALOG
          # =============================================================================

          KEV_CATALOG_URL = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
          kev_cache: Dict[str, Dict] = {}
          kev_loaded = False
          kev_failed = False

          class NvdUnavailable(RuntimeError):
              """A complete NVD response could not be obtained."""

          class KevUnavailable(RuntimeError):
              """KEV classifications must not be replaced with unknown data."""

          def fetch_kev_catalog() -> Dict[str, Dict]:
              """Load KEV once, with bounded retries, before any CVE file is changed."""
              global kev_cache, kev_loaded, kev_failed
              if kev_loaded:
                  return kev_cache
              if kev_failed:
                  raise KevUnavailable("CISA KEV catalog is unavailable")
              print("Fetching CISA KEV catalog...")
              for attempt in range(MAX_RETRIES):
                  try:
                      response = requests.get(KEV_CATALOG_URL, timeout=30)
                      if response.status_code != 200:
                          raise ValueError("Unsuccessful KEV response")
                      data = response.json()
                      vulnerabilities = data.get('vulnerabilities') if isinstance(data, dict) else None
                      if not isinstance(vulnerabilities, list) or not vulnerabilities:
                          raise ValueError("Empty or malformed KEV catalog")
                      catalog = {}
                      for vuln in vulnerabilities:
                          if not isinstance(vuln, dict) or not isinstance(vuln.get('cveID'), str) or not re.fullmatch(r'CVE-[0-9]{4}-[0-9]{4,}', vuln['cveID'], re.IGNORECASE):
                              raise ValueError("Malformed KEV entry")
                          cve_id = vuln['cveID'].upper()
                          catalog[cve_id] = {
                              'vendor': vuln.get('vendorProject'),
                              'product': vuln.get('product'),
                              'vulnerability_name': vuln.get('vulnerabilityName'),
                              'date_added': vuln.get('dateAdded'),
                              'due_date': vuln.get('dueDate'),
                              'known_ransomware_use': vuln.get('knownRansomwareCampaignUse', 'Unknown'),
                              'notes': vuln.get('notes'),
                          }
                      kev_cache = catalog
                      kev_loaded = True
                      print(f"Loaded {len(kev_cache)} KEV entries")
                      return kev_cache
                  except (requests.exceptions.RequestException, ValueError, TypeError):
                      print(f"KEV catalog unavailable, attempt {attempt + 1}/{MAX_RETRIES}")
                      if attempt < MAX_RETRIES - 1:
                          time.sleep(RETRY_DELAY * (attempt + 1))
              kev_failed = True
              raise KevUnavailable("CISA KEV catalog could not be verified; previous data is preserved")

          def is_kev(cve_id: str) -> Optional[Dict]:
              """Check if a CVE is in the KEV catalog."""
              kev = fetch_kev_catalog()
              return kev.get(cve_id.upper())

          # =============================================================================
          # NVD API FUNCTIONS
          # =============================================================================

          def log(message):
              app = getattr(WORK_CONTEXT, 'app', None)
              with LOG_LOCK:
                  print(f"[{app}] {message}" if app else str(message), flush=True)


          class RuntimeControl:
              """Share attempt pacing, cooldown, deadlines and sanitized measurements."""
              def __init__(self, spacing, start_seconds, hard_seconds, clock=None, sleeper=None):
                  self.clock = clock or time.monotonic
                  self.sleep = sleeper or time.sleep
                  self.started = self.clock()
                  self.start_deadline = self.started + start_seconds
                  self.hard_deadline = self.started + hard_seconds
                  self.spacing = spacing
                  self.next_start = self.started
                  self.cooldown_until = self.started
                  self.lock = threading.Lock()
                  self.attempts = []
                  self.app_times = {}
                  self.cooldown_seconds = 0.0
                  self.stopped = False

              def acquire(self):
                  began = self.clock()
                  while True:
                      with self.lock:
                          now = self.clock()
                          if self.stopped or now >= self.start_deadline:
                              raise NvdUnavailable("scan start deadline exceeded; previous data is preserved")
                          allowed = max(self.next_start, self.cooldown_until)
                          if now >= allowed:
                              self.next_start = now + self.spacing
                              return now - began
                          delay = min(allowed - now, self.start_deadline - now)
                      self.sleep(delay)

              def pause(self, seconds):
                  with self.lock:
                      remaining = self.start_deadline - self.clock()
                  if remaining <= 0 or seconds >= remaining:
                      raise NvdUnavailable("scan start deadline exceeded; previous data is preserved")
                  self.sleep(seconds)

              def cooldown(self, seconds):
                  seconds = max(0.0, min(120.0, seconds))
                  with self.lock:
                      now = self.clock()
                      prior = max(now, self.cooldown_until)
                      self.cooldown_until = max(prior, now + seconds)
                      self.cooldown_seconds += self.cooldown_until - prior

              def record(self, row):
                  with self.lock:
                      self.attempts.append(row)
                  with LOG_LOCK:
                      print('NVD_ATTEMPT ' + json.dumps(row, sort_keys=True), flush=True)

              def report(self):
                  with self.lock:
                      rows = list(self.attempts)
                      app_times = dict(self.app_times)
                      cooldown = self.cooldown_seconds
                  durations = sorted(r['elapsedSeconds'] for r in rows)
                  outcomes = {}
                  for row in rows:
                      outcomes[row['outcome']] = outcomes.get(row['outcome'], 0) + 1
                  def percentile(fraction):
                      return durations[min(len(durations)-1, int((len(durations)-1)*fraction))] if durations else 0
                  summary = {'attempts':len(rows), 'outcomes':outcomes, 'latencyP50':percentile(.5),
                             'latencyP90':percentile(.9), 'latencyMax':max(durations, default=0),
                             'pacerWaitSeconds':round(sum(r['pacerWaitSeconds'] for r in rows), 3),
                             'globalCooldownSeconds':round(cooldown, 3), 'appWallSeconds':app_times,
                             'slowestAttempts':sorted(rows, key=lambda r:r['elapsedSeconds'], reverse=True)[:10]}
                  with LOG_LOCK:
                      print('CVE_METRICS ' + json.dumps(summary, sort_keys=True), flush=True)
                  return summary


          def exception_outcome(exc):
              if isinstance(exc, requests.exceptions.Timeout):
                  return 'timeout'
              pending = [exc]
              for _ in range(8):
                  if not pending:
                      break
                  value = pending.pop()
                  if type(value).__name__ == 'ReadTimeoutError':
                      return 'body_read_timeout'
                  if isinstance(value, BaseException):
                      pending.extend(arg for arg in value.args if isinstance(arg, BaseException))
                      if value.__cause__ is not None:
                          pending.append(value.__cause__)
              return 'connection_error'


          def retry_after_seconds(response, fallback):
              value = getattr(response, 'headers', {}).get('Retry-After', '')
              try:
                  return min(120.0, max(fallback, float(value)))
              except (ValueError, TypeError):
                  try:
                      delay = parsedate_to_datetime(value).timestamp() - time.time()
                      return min(120.0, max(fallback, delay))
                  except (ValueError, TypeError, OverflowError):
                      return fallback


          def nvd_request(url: str, params: Dict = None) -> Dict:
              """Return a complete validated page, with every attempt globally paced."""
              headers = {'apiKey': NVD_API_KEY} if NVD_API_KEY else {}
              reason = "NVD request failed"
              for attempt in range(MAX_RETRIES):
                  waited = CONTROL.acquire()
                  began = time.monotonic()
                  outcome = 'unknown'
                  exception_type = None
                  response_bytes = None
                  try:
                      response = requests.get(url, params=params, headers=headers, timeout=(10, 60))
                      outcome = str(response.status_code)
                      response_bytes = len(getattr(response, 'content', b''))
                      if response.status_code == 200:
                          try:
                              data = response.json()
                          except (ValueError, TypeError):
                              outcome = 'bad_json'
                              reason = 'NVD response was not valid JSON'
                          else:
                              if not isinstance(data, dict) or type(data.get('totalResults')) is not int or data['totalResults'] < 0 or not isinstance(data.get('vulnerabilities'), list):
                                  raise NvdUnavailable("Malformed NVD response")
                              if 'startIndex' in data and type(data['startIndex']) is not int:
                                  raise NvdUnavailable("Malformed NVD page offset")
                              return data
                      else:
                          reason = f"NVD API returned HTTP {response.status_code}"
                          if response.status_code in {403, 429, 503}:
                              CONTROL.cooldown(retry_after_seconds(response, RETRY_DELAY * (attempt + 1)))
                          if response.status_code not in {403, 429} and response.status_code < 500:
                              raise NvdUnavailable(reason)
                  except NvdUnavailable:
                      raise
                  except requests.exceptions.RequestException as exc:
                      outcome = exception_outcome(exc)
                      exception_type = type(exc).__name__
                      reason = 'NVD provider transport failed (' + outcome + ')'
                  finally:
                      CONTROL.record({'app':getattr(WORK_CONTEXT, 'app', ''),
                                      'product':(params or {}).get('virtualMatchString', ''),
                                      'startIndex':(params or {}).get('startIndex', 0), 'attempt':attempt+1,
                                      'outcome':outcome, 'exceptionType':exception_type, 'responseBytes':response_bytes,
                                      'elapsedSeconds':round(time.monotonic()-began, 3),
                                      'pacerWaitSeconds':round(waited, 3)})
                  log(f"{reason}, attempt {attempt + 1}/{MAX_RETRIES}")
                  if attempt < MAX_RETRIES - 1:
                      CONTROL.pause(RETRY_DELAY * (attempt + 1))
              raise NvdUnavailable(reason + "; previous data is preserved")


          def extract_version_info(config: Dict) -> Dict[str, Any]:
              """Extract version range information from CVE configuration."""
              version_info = {
                  'affected_version_start': None,
                  'affected_version_start_type': None,
                  'affected_version_end': None,
                  'affected_version_end_type': None,
              }

              nodes = config.get('nodes', [])
              for node in nodes:
                  cpe_matches = node.get('cpeMatch', [])
                  for match in cpe_matches:
                      if match.get('vulnerable', False):
                          # Version start
                          if 'versionStartIncluding' in match:
                              version_info['affected_version_start'] = match['versionStartIncluding']
                              version_info['affected_version_start_type'] = 'including'
                          elif 'versionStartExcluding' in match:
                              version_info['affected_version_start'] = match['versionStartExcluding']
                              version_info['affected_version_start_type'] = 'excluding'

                          # Version end
                          if 'versionEndIncluding' in match:
                              version_info['affected_version_end'] = match['versionEndIncluding']
                              version_info['affected_version_end_type'] = 'including'
                          elif 'versionEndExcluding' in match:
                              version_info['affected_version_end'] = match['versionEndExcluding']
                              version_info['affected_version_end_type'] = 'excluding'

                          # If we found version info, return it
                          if any(version_info.values()):
                              return version_info

              return version_info

          def extract_fixed_version(description: str, version_info: Dict) -> Optional[str]:
              """Extract fixed version from description or version info."""
              # If we have version end with excluding type, that's the fixed version
              if version_info.get('affected_version_end') and version_info.get('affected_version_end_type') == 'excluding':
                  return version_info['affected_version_end']

              # Try to extract from description
              import re
              patterns = [
                  r'(?:fixed|patched|resolved|addressed)\s+(?:in\s+)?(?:version\s+)?(\d+(?:\.\d+)+)',
                  r'(?:before|prior to)\s+(?:version\s+)?(\d+(?:\.\d+)+)',
                  r'(?:upgrade|update)\s+to\s+(?:version\s+)?(\d+(?:\.\d+)+)',
                  r'versions?\s+(?:before|prior to|<)\s+(\d+(?:\.\d+)+)',
              ]

              for pattern in patterns:
                  match = re.search(pattern, description, re.IGNORECASE)
                  if match:
                      return match.group(1)

              return None

          def is_macos_relevant(cve_data: Dict, vendor: str, product: str) -> bool:
              """Check if CVE is relevant to macOS platform."""
              configurations = cve_data.get('configurations', [])

              # If no configurations, check description
              if not configurations:
                  description = ""
                  for desc in cve_data.get('descriptions', []):
                      if desc.get('lang') == 'en':
                          description = desc.get('value', '').lower()
                          break

                  # Exclude if explicitly mentions only other platforms
                  exclude_terms = ['windows only', 'linux only', 'android only', 'ios only', 'iphone only']
                  if any(term in description for term in exclude_terms):
                      return False

                  # Include if mentions macOS or doesn't specify platform
                  return True

              # Check CPE configurations for platform
              for config in configurations:
                  nodes = config.get('nodes', [])
                  for node in nodes:
                      cpe_matches = node.get('cpeMatch', [])
                      for match in cpe_matches:
                          cpe = match.get('criteria', '')
                          parts = cpe.split(':')

                          if len(parts) >= 11:
                              cpe_vendor = parts[3].lower()
                              cpe_product = parts[4].lower()
                              target_sw = parts[10].lower() if len(parts) > 10 else '*'
                              target_hw = parts[11].lower() if len(parts) > 11 else '*'

                              # Check if this matches our vendor/product
                              if cpe_vendor == vendor.lower() and cpe_product == product.lower():
                                  # Check platform
                                  if target_sw in ['*', 'macos', 'mac_os', 'mac_os_x', 'darwin']:
                                      return True
                                  if target_hw in ['*', 'mac', 'x86', 'x64', 'arm64']:
                                      return True
                                  # Exclude explicit non-macOS platforms
                                  if target_sw in ['windows', 'linux', 'android', 'ios', 'iphone_os']:
                                      continue

              # Default to including if no explicit exclusion
              return True

          def fetch_cves_for_app(app_key: str, vendor: str, product: str, alt_products: List[str]) -> List[Dict]:
              """Fetch CVEs for an app using its CPE vendor:product."""
              all_cves = []
              seen_cve_ids = set()

              products_to_check = [product] + alt_products

              for prod in products_to_check:
                  # Build CPE match string for virtualMatchString (pattern matching)
                  cpe_match = f"cpe:2.3:a:{vendor}:{prod}"

                  log(f"  Querying NVD for CPE pattern: {cpe_match}")

                  url = "https://services.nvd.nist.gov/rest/json/cves/2.0"

                  # Paginate through all results
                  start_index = 0
                  results_per_page = 500
                  total_results = None
                  product_cve_ids = set()

                  while True:
                      params = {
                          'virtualMatchString': cpe_match,
                          'resultsPerPage': results_per_page,
                          'startIndex': start_index,
                      }

                      data = nvd_request(url, params)
                      vulnerabilities = data['vulnerabilities']
                      if total_results is None:
                          total_results = data['totalResults']
                          log(f"  Found {total_results} total CVEs for {vendor}:{prod}")
                      if data['totalResults'] != total_results or data.get('startIndex', start_index) != start_index:
                          raise NvdUnavailable("NVD pagination changed during collection")
                      if len(vulnerabilities) > total_results - start_index or (not vulnerabilities and start_index < total_results):
                          raise NvdUnavailable("Incomplete NVD page")
                      if not vulnerabilities:
                          break
                      page_ids = []
                      for vuln in vulnerabilities:
                          cve = vuln.get('cve') if isinstance(vuln, dict) else None
                          if not isinstance(cve, dict) or not isinstance(cve.get('id'), str) or not re.fullmatch(r'CVE-[0-9]{4}-[0-9]{4,}', cve['id']):
                              raise NvdUnavailable("Malformed NVD vulnerability")
                          page_ids.append(cve['id'])
                      if len(set(page_ids)) != len(page_ids) or product_cve_ids.intersection(page_ids):
                          raise NvdUnavailable("Repeated NVD page entries")
                      product_cve_ids.update(page_ids)

                      # Process CVEs from this page
                      for vuln in vulnerabilities:
                          cve = vuln.get('cve', {})
                          cve_id = cve.get('id', '')

                          # Skip duplicates
                          if cve_id in seen_cve_ids:
                              continue

                          # Check if relevant to macOS
                          if not is_macos_relevant(cve, vendor, prod):
                              continue

                          seen_cve_ids.add(cve_id)

                          # Extract description
                          description = ""
                          for desc in cve.get('descriptions', []):
                              if desc.get('lang') == 'en':
                                  description = desc.get('value', '')
                                  break

                          # Extract dates
                          published = cve.get('published', '')
                          last_modified = cve.get('lastModified', '')
                          published_date = published.split('T')[0] if published else None
                          last_modified_date = last_modified.split('T')[0] if last_modified else None

                          # Extract CVSS metrics
                          metrics = cve.get('metrics', {})
                          base_score = None
                          severity = None
                          cvss_version = None
                          cvss_vector = None

                          # Try CVSS 3.1 first, then 3.0, then 2.0
                          for version_key, version_name in [('cvssMetricV31', '3.1'), ('cvssMetricV30', '3.0'), ('cvssMetricV2', '2.0')]:
                              if version_key in metrics and metrics[version_key]:
                                  cvss_data = metrics[version_key][0].get('cvssData', {})
                                  base_score = cvss_data.get('baseScore')
                                  severity = cvss_data.get('baseSeverity')
                                  cvss_version = version_name
                                  cvss_vector = cvss_data.get('vectorString')

                                  # For CVSS 2.0, severity might be in a different location
                                  if not severity and version_key == 'cvssMetricV2':
                                      severity = metrics[version_key][0].get('baseSeverity')
                                  break

                          # Extract version information
                          configurations = cve.get('configurations', [])
                          version_info = {}
                          for config in configurations:
                              version_info = extract_version_info(config)
                              if any(version_info.values()):
                                  break

                          # Extract fixed version
                          fixed_version = extract_fixed_version(description, version_info)

                          # Check KEV status
                          kev_info = is_kev(cve_id)

                          # Build CVE record
                          cve_record = {
                              'cve_id': cve_id,
                              'published_date': published_date,
                              'last_modified_date': last_modified_date,
                              'description': description,
                              'base_score': base_score,
                              'severity': severity,
                              'cvss_version': cvss_version,
                              'cvss_vector': cvss_vector,
                              'affected_version_start': version_info.get('affected_version_start'),
                              'affected_version_start_type': version_info.get('affected_version_start_type'),
                              'affected_version_end': version_info.get('affected_version_end'),
                              'affected_version_end_type': version_info.get('affected_version_end_type'),
                              'fixed_version': fixed_version,
                              'is_kev': kev_info is not None,
                              'kev_date_added': kev_info.get('date_added') if kev_info else None,
                              'kev_due_date': kev_info.get('due_date') if kev_info else None,
                              'kev_ransomware_use': kev_info.get('known_ransomware_use') if kev_info else None,
                              'vendor': vendor,
                              'product': prod,
                          }

                          all_cves.append(cve_record)

                      # Move to next page
                      start_index += len(vulnerabilities)
                      if start_index >= total_results:
                          break

                      log(f"    Fetched {start_index}/{total_results} CVEs...")

              return all_cves

          def sort_cves(cves: List[Dict]) -> List[Dict]:
              """Sort CVEs by severity and date (most critical/recent first)."""
              severity_order = {'CRITICAL': 0, 'HIGH': 1, 'MEDIUM': 2, 'LOW': 3, None: 4}

              def sort_key(cve):
                  # KEV CVEs first
                  kev_priority = 0 if cve.get('is_kev') else 1
                  # Then by severity
                  severity = severity_order.get(cve.get('severity', '').upper() if cve.get('severity') else None, 4)
                  # Then by date (newest first)
                  date = cve.get('published_date') or '1970-01-01'
                  return (kev_priority, severity, -int(date.replace('-', '')))

              return sorted(cves, key=sort_key)

          def save_cve_json(app_key: str, app_name: str, cves: List[Dict]):
              """Save CVEs to JSON file."""
              output = {
                  'app_name': app_name,
                  'app_key': app_key,
                  'last_updated': datetime.now().strftime('%Y-%m-%d'),
                  'total_cves': len(cves),
                  'summary': {
                      'critical': sum(1 for c in cves if (c.get('severity') or '').upper() == 'CRITICAL'),
                      'high': sum(1 for c in cves if (c.get('severity') or '').upper() == 'HIGH'),
                      'medium': sum(1 for c in cves if (c.get('severity') or '').upper() == 'MEDIUM'),
                      'low': sum(1 for c in cves if (c.get('severity') or '').upper() == 'LOW'),
                      'kev_count': sum(1 for c in cves if c.get('is_kev')),
                  },
                  'vulnerabilities': cves,
              }

              file_path = CVE_DIR / f"{app_key}.json"
              temporary = None
              try:
                  with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8', dir=CVE_DIR,
                                                   prefix=f'.{app_key}.', suffix='.tmp', delete=False) as f:
                      temporary = pathlib.Path(f.name)
                      json.dump(output, f, indent=2, default=str)
                  os.replace(temporary, file_path)
              finally:
                  if temporary is not None:
                      temporary.unlink(missing_ok=True)

              print(f"  Saved {len(cves)} CVEs to {file_path}")

          # =============================================================================
          # MAIN EXECUTION
          # =============================================================================

          def app_weight(app_key):
              try:
                  data = json.loads((CVE_DIR / f'{app_key}.json').read_text())
                  value = data.get('total_cves', 0)
                  return value if type(value) is int and value >= 0 else 0
              except (OSError, ValueError, TypeError, AttributeError):
                  return 0


          def process_app(app_key, mapping):
              WORK_CONTEXT.app = app_key
              began = time.monotonic()
              log('Starting complete CVE collection')
              try:
                  vendor, product, alternatives = mapping
                  return sort_cves(fetch_cves_for_app(app_key, vendor, product, alternatives)), None
              except Exception as exc:
                  error = str(exc) if isinstance(exc, NvdUnavailable) else type(exc).__name__
                  return None, error
              finally:
                  with CONTROL.lock:
                      CONTROL.app_times[app_key] = round(time.monotonic()-began, 3)
                  log('Finished CVE collection')
                  WORK_CONTEXT.app = None


          def collect_apps(apps):
              indexed = list(enumerate(apps.items()))
              ordered = sorted(indexed, key=lambda row:(-app_weight(row[1][0]), row[0]))
              executor = ThreadPoolExecutor(max_workers=NVD_WORKERS)
              futures = {}
              try:
                  for index, (key, mapping) in ordered:
                      futures[key] = executor.submit(process_app, key, mapping)
                  remaining = max(0.0, CONTROL.hard_deadline - time.monotonic())
                  done, unfinished = wait(list(futures.values()), timeout=remaining)
                  if unfinished:
                      with CONTROL.lock:
                          CONTROL.stopped = True
                      for future in unfinished:
                          future.cancel()
                      log('SCAN INCOMPLETE: deadline; unfinished apps: ' + ', '.join(k for k,f in futures.items() if f in unfinished))
                      CONTROL.report()
                      sys.stdout.flush()
                      sys.stderr.flush()
                      os._exit(1)
                  return {key:futures[key].result() for key in apps}
              finally:
                  executor.shutdown(wait=False, cancel_futures=True)


          def main():
              global CONTROL
              if not NVD_API_KEY:
                  print("ERROR: NVD_API_KEY is required. Add it as a repository secret.")
                  raise SystemExit(1)
              CONTROL = RuntimeControl(REQUEST_DELAY, SCAN_START_SECONDS, SCAN_HARD_SECONDS)
              try:
                  print("=" * 60)
                  print("IntuneBrew CVE Scanner")
                  print(f"Date: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}")
                  print(f"Full sync: {FULL_SYNC}")
                  print(f"Specific app: {SPECIFIC_APP or 'All apps'}")
                  print(f"Apps configured: {len(CPE_MAPPINGS)}")
                  fetch_kev_catalog()
                  if SPECIFIC_APP:
                      if SPECIFIC_APP not in CPE_MAPPINGS:
                          raise SystemExit(1)
                      apps = {SPECIFIC_APP:CPE_MAPPINGS[SPECIFIC_APP]}
                  else:
                      apps = CPE_MAPPINGS
                  results = collect_apps(apps)
                  errors = [(key, result[1]) for key, result in results.items() if result[1] is not None]
                  print("SCAN COMPLETE")
                  print(f"Apps processed: {len(results)}")
                  print(f"Errors: {len(errors)}")
                  if errors:
                      for key, error in errors:
                          log(f"ERROR: {key}: {error}")
                      raise SystemExit(1)
                  # Keep the entire previous workspace unchanged unless every app finished.
                  for key, (cves, error) in results.items():
                      name = ' '.join(word.capitalize() for word in key.split('_'))
                      save_cve_json(key, name, cves)
                  print("Done!")
              finally:
                  CONTROL.report()


          if __name__ == '__main__':
              main()
          PYTHON_SCRIPT

          timeout --kill-after=30s 52m python -u check_cves.py

      - name: Commit and push CVE files
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add CVE/
            git commit -m "Update CVE data [skip ci]"
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "Push rejected (attempt $attempt) - fetching and rebasing on origin/main..."
              git pull --rebase origin main
            done
            echo "Push failed after 5 attempts"
            exit 1
          else
            echo "No changes to commit"
          fi

      - name: Sync CVE data to Supabase
        if: ${{ success() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Skip if secrets are not configured
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets not configured, skipping sync"
            exit 0
          fi

          pip install supabase
          python .github/scripts/sync_cves_to_supabase.py --cve-dir ./CVE --apps-dir ./Apps
